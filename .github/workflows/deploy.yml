name: Deploy dashboard to GitHub Pages

# Builds the static dashboard in site/ and deploys it to GitHub Pages.
# The build is strictly read-only over analyses/** — see the SAFETY CONTRACT
# in site/scripts/build-data.mjs. Nothing in this workflow writes back to the repo.

on:
  push:
    branches: [main]
    # Only rebuild when the data or the site itself changes.
    paths:
      - 'analyses/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate analyses data (schema-drift guard, read-only)
        run: npm run validate

      - name: Build dashboard (normalize data + astro build)
        env:
          # Microsoft Clarity project ID — set as a repo Variable (not Secret),
          # since it's exposed in client HTML anyway. Delete the variable to
          # disable analytics on the next deploy.
          PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
